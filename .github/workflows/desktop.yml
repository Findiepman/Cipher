# Builds the desktop app in desktop/ for Windows, macOS and Linux.
#
# The app bundles the web client, so this workflow builds client/ first (from
# the repo root, with the whole workspace installed) and then the Tauri shell
# around it. That also means a change under client/ only reaches desktop
# users through a release made here; the web deploys on its own cadence from
# deploy/. desktop/UPDATES.md is the release procedure.
#
# Two ways to run it, on purpose:
#
# - A push to main that touches desktop/, client/, packages/ or this file
#   builds all platforms and keeps the installers as workflow artifacts for a
#   week. That proves the packaging still works and gives you something to
#   try, and it creates no release.
# - Manual dispatch does the same build and then publishes a DRAFT GitHub
#   release tagged desktop-v<version>, with latest.json attached for the
#   updater. Publishing the draft by hand is the release. Nothing installed
#   anywhere sees an update until you press that button.
#
# Secrets it needs (Settings -> Secrets and variables -> Actions):
#
#   TAURI_SIGNING_PRIVATE_KEY           the whole content of ~/.tauri/cipher.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  empty today: the key was generated
#                                       without one. Set it if you regenerate
#                                       the key with a password.
#
# The private key must never be committed. desktop/UPDATES.md says where it
# lives and what to do if it is lost. There are no OS code-signing
# certificates yet (Apple Developer ID, Windows Authenticode), so the
# installers are unsigned; see desktop/README.md -> "Code signing" before
# handing one to anybody.

name: desktop

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'client/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

# One release at a time. A second dispatch while one is uploading would race
# it for the same draft release and the same latest.json.
concurrency:
  group: desktop-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          # 22.04 rather than latest: the AppImage links against the glibc of
          # the builder, so an older builder runs on more machines.
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      # The whole workspace, because client/ depends on packages/crypto and
      # the one lockfile lives at the root. server/'s postinstall runs
      # `prisma generate`, which wants a DATABASE_URL to exist even though
      # nothing here ever connects to it.
      - name: Install the workspace
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
        run: npm ci

      # The lockfile is generated on Windows and records only the Windows
      # native binaries for rollup and esbuild; `npm ci` installs exactly
      # what it lists, so on macOS and Linux both arrive without one and vite
      # dies with "Cannot find module @rollup/rollup-<platform>" (npm/cli#4828).
      # Same fix as client/Dockerfile: ask the tree what versions it holds,
      # and add the binary for the machine doing the building.
      #
      # This install runs at the workspace root, so it re-runs every
      # workspace's postinstall, including server/'s `prisma generate`, which
      # needs the same placeholder DATABASE_URL as `npm ci` above. Without it
      # the step dies with "Cannot resolve environment variable: DATABASE_URL"
      # on every platform that reaches it. The Dockerfile sets it with ENV,
      # which persists; here each step has to be told again.
      - name: Install the native binaries the lockfile does not list
        if: runner.os != 'Windows'
        shell: bash
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
        run: |
          set -eux
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) rollup=darwin-arm64; esbuild=darwin-arm64 ;;
            Darwin-x86_64) rollup=darwin-x64; esbuild=darwin-x64 ;;
            Linux-x86_64) rollup=linux-x64-gnu; esbuild=linux-x64 ;;
            *) echo "unsupported builder: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          rollup_version="$(node -p "require('rollup/package.json').version")"
          esbuild_version="$(node -p "require('esbuild/package.json').version")"
          npm install --no-save --no-audit --no-fund \
            "@rollup/rollup-${rollup}@${rollup_version}" \
            "@esbuild/${esbuild}@${esbuild_version}"

      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm ci

      # The release body is the changelog section for this version
      # (desktop/CHANGELOG.md). The app quotes it in the update banner, so a
      # dispatch with no entry fails here rather than shipping a release that
      # says nothing. A push build has no release and skips the check.
      - name: Read the changelog entry
        id: notes
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -eu
          version="$(sed -n 's/.*"version": "\([0-9][0-9.]*\)".*/\1/p' desktop/src-tauri/tauri.conf.json | head -1)"
          body="$(awk -v v="$version" '/^## /{p = ($2 == v)} p && !/^## /' desktop/CHANGELOG.md | sed -e '1{/^$/d}' -e '${/^$/d}')"
          if [ -z "$body" ]; then
            echo "desktop/CHANGELOG.md has no '## $version' section. Write one, then dispatch again." >&2
            exit 1
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            echo "$body"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      # `tauri build` runs beforeBuildCommand from tauri.conf.json first,
      # which is the client build in desktop mode, then bundles it.
      - name: Build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          # An empty tagName means "build only": no release is touched.
          tagName: ${{ github.event_name == 'workflow_dispatch' && 'desktop-v__VERSION__' || '' }}
          releaseName: 'Cipher desktop v__VERSION__'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          # A push build has no release to land on, so the installers are
          # kept as workflow artifacts instead (Actions, the run, Artifacts).
          uploadWorkflowArtifacts: ${{ github.event_name == 'push' }}
