[package]
name = "cipher-desktop"
version = "0.1.0"
description = "The Cipher desktop shell: one native window around the deployed web app."
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Not used directly: `tauri::generate_context!` expands to code that needs
# them in the app crate, as in the official template.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"

# The profile Tauri recommends for a small binary. `panic` is left at the
# default so a crash still unwinds and the updater's error path runs.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
