[package]
name = "cipher-desktop"
version = "0.2.0"
description = "The Cipher desktop app: the bundled web client in a native shell, with a tray, notifications and signed updates."
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is the one feature the shell needs beyond the defaults.
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# All official plugins, from tauri-apps/plugins-workspace. Each one is here
# for one feature, named in src/main.rs where it is registered.
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
# For the timer in updater.rs. Tauri runs on tokio already; this only names it.
tokio = { version = "1", features = ["time"] }

# The profile Tauri recommends for a small binary. `panic` is left at the
# default so a crash still unwinds and the updater's error path runs.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
