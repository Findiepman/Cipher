# DEVELOPMENT ONLY - do not run this on the server.
#
# It publishes 5432, 1025 and 8025 on the host and uses fixed container names,
# so on a machine that already runs other services it will collide. It assumes
# a laptop with nothing else on those ports.
#
# The deployable stack is ../deploy/docker-compose.prod.yml, which publishes no
# host ports at all - see ../DEPLOY.md.

services:
  postgres:
    image: postgres:17-alpine
    container_name: messenger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger
      POSTGRES_DB: messenger
    ports:
      - "5432:5432"
    volumes:
      - messenger-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: messenger-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI - read verification/reset emails here

volumes:
  messenger-pgdata:
